<title>Robin Räikkönen Paddock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Saira:ital,wdth,wght@0,50..125,400..900;1,50..125,400..900&display=swap">
<style>
:root{
  --ground:#EDF2F5; --surface:#FFFFFF; --surface-2:#E3EAF0; --ink:#0D1B2A; --ink-2:#4A5D6E; --ink-3:#768999; --line:#CAD5DE;
  --blue:#1B4DB1; --blue-ink:#FFFFFF; --blue-soft:#DCE6F8; --kerb:#D22F28; --kerb-alt:#FFFFFF; --kerb-soft:#FBE4E2;
  --gold:#C99A12; --silver:#8E9CA8; --bronze:#B06A2E; --ok:#1C7F4F; --warn:#A86E12;
  --night:#0A1119; --snow:#F2F6F9; --ice:#8FB8FF;
  --shadow:0 1px 2px rgba(13,27,42,.05),0 10px 28px -16px rgba(13,27,42,.22);
  --f-display:"Saira","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0A1119; --surface:#111C27; --surface-2:#182635; --ink:#E4ECF2; --ink-2:#9CAFBF; --ink-3:#6C8093; --line:#223445;
    --blue:#80B1FF; --blue-ink:#0A1119; --blue-soft:#15294A; --kerb:#FF5D51; --kerb-alt:#E4ECF2; --kerb-soft:#3B1816;
    --gold:#E4BF52; --silver:#AFBCC7; --bronze:#D78F52; --ok:#4FC48C; --warn:#E8AA3E;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 30px -16px rgba(0,0,0,.75);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0A1119; --surface:#111C27; --surface-2:#182635; --ink:#E4ECF2; --ink-2:#9CAFBF; --ink-3:#6C8093; --line:#223445;
  --blue:#80B1FF; --blue-ink:#0A1119; --blue-soft:#15294A; --kerb:#FF5D51; --kerb-alt:#E4ECF2; --kerb-soft:#3B1816;
  --gold:#E4BF52; --silver:#AFBCC7; --bronze:#D78F52; --ok:#4FC48C; --warn:#E8AA3E;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 30px -16px rgba(0,0,0,.75);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--ground);color:var(--ink);font:15px/1.55 var(--f-body);margin:0;min-height:100%}
a{color:var(--blue);text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}
button{font:inherit;color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.05;text-wrap:balance}
h2{font-size:clamp(30px,4.4vw,44px);font-weight:850;font-style:italic;font-stretch:74%;text-transform:uppercase;letter-spacing:.005em}
h3{font-size:20px;font-weight:750;font-stretch:88%;letter-spacing:.01em}
p{margin:0}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:clamp(16px,4vw,32px)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.eyebrow{font:600 12px/1.3 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.ic{display:inline-flex;width:1.2em;height:1.2em;vertical-align:-.2em;flex:none}
.ic svg{width:100%;height:100%;display:block}
.flag{display:inline-block;width:1.4em;height:1.05em;border-radius:2px;overflow:hidden;vertical-align:-.15em;box-shadow:0 0 0 1px rgba(0,0,0,.12);flex:none}
.flag svg{width:100%;height:100%;display:block}
.shape{display:block}
.shape path{fill:none;stroke:currentColor;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke;stroke-width:3}
.shape.bold path{stroke-width:5}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 8px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;text-decoration:none;color:var(--ink)}
.brand b{font:italic 850 22px/1 var(--f-display);font-stretch:70%;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.brand b i{color:var(--kerb);font-style:italic}
.brand span{font:500 11px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface);flex:none}
.lang button{border:0;background:none;padding:5px 10px;border-radius:999px;font:600 12px/1 var(--f-mono);letter-spacing:.06em;color:var(--ink-2);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;display:flex;align-items:center;gap:6px;padding:9px 11px 11px;font:700 14px/1 var(--f-display);font-stretch:85%;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);text-decoration:none;border-bottom:3px solid transparent}
.nav a .ic{width:15px;height:15px;opacity:.8}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--kerb)}
.kerb{height:6px;background:repeating-linear-gradient(90deg,var(--kerb) 0 22px,var(--kerb-alt) 22px 44px);border-block:1px solid var(--line)}

main{padding-block:24px 56px}
.view{display:grid;gap:28px;animation:rise .35s ease both}
@keyframes rise{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}*{transition:none!important;animation:none!important}}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-head p{max-width:62ch}
.h3i{display:flex;align-items:center;gap:10px}
.h3i .ic{color:var(--kerb);width:22px;height:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,2.4vw,24px);display:grid;gap:14px;align-content:start;min-width:0}
.panel.lift{box-shadow:var(--shadow)}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px}
.link-more{display:inline-flex;align-items:center;gap:6px;font:600 13px/1 var(--f-mono);letter-spacing:.04em;text-decoration:none;background:none;border:0;padding:0;color:var(--blue);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font:600 12px/1.2 var(--f-mono);letter-spacing:.03em;color:var(--ink-2);white-space:nowrap}
.chip.rb{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.chip.rb::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--kerb)}
.chip.st-confirmed{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.chip.st-likely{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 45%,var(--line))}
.chip.st-possible{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.chip.st-unknown{color:var(--ink-3)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font:600 12px/1 var(--f-mono);letter-spacing:.04em;color:var(--ink-2);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.filters button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.credit{font:500 10.5px/1.35 var(--f-mono);color:var(--ink-3);letter-spacing:.01em}
.credit a{color:inherit}
details.more{border-top:1px dashed var(--line);padding-top:8px}
details.more summary{cursor:pointer;font:600 12px/1.4 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--blue);list-style:none;display:inline-flex;gap:6px;align-items:center}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+";font-size:14px}
details.more[open] summary::after{content:"–"}
details.more > div{display:grid;gap:8px;margin-top:8px;font-size:14px;color:var(--ink-2)}

/* ---------- photo banner / hero ---------- */
.dark-media{position:relative;border-radius:16px;overflow:hidden;background:var(--night);color:var(--snow);isolation:isolate}
.dark-media > img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.dark-media::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(8,14,21,.9) 0%,rgba(8,14,21,.66) 48%,rgba(8,14,21,.22) 100%),linear-gradient(0deg,rgba(8,14,21,.8),rgba(8,14,21,0) 55%)}
.dark-media .eyebrow{color:rgba(242,246,249,.74)}
.dark-media .ph-credit{position:absolute;right:12px;bottom:8px;left:auto;max-width:60%;text-align:right;font:500 10px/1.3 var(--f-mono);color:rgba(242,246,249,.58)}
.dark-media .ph-credit a{color:inherit}
.banner{min-height:210px;display:grid;align-content:end;padding:clamp(20px,4vw,36px);padding-bottom:36px}
.banner h2{color:var(--snow)}
.banner p.intro{color:rgba(242,246,249,.84);max-width:60ch;margin-top:10px}
.plainhead{display:grid;gap:8px}

.hero{min-height:clamp(440px,52vw,580px);display:grid}
.hero-in{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.9fr);gap:28px;align-items:end;padding:clamp(20px,4vw,40px);padding-bottom:40px}
@media (max-width:880px){.hero-in{grid-template-columns:1fr}}
.hero-id{position:relative;display:grid;gap:16px;align-content:end;min-width:0}
.ghost-num{position:absolute;right:0;top:-40px;z-index:-1;font:italic 900 clamp(150px,24vw,290px)/.8 var(--f-display);font-stretch:62%;color:transparent;-webkit-text-stroke:2px rgba(242,246,249,.16);letter-spacing:-.02em;user-select:none}
.mega{font-size:clamp(58px,11vw,132px);font-weight:900;font-style:italic;font-stretch:66%;text-transform:uppercase;line-height:.84;letter-spacing:-.01em;display:grid;color:var(--snow)}
.mega span:last-child{color:var(--ice)}
.lede{font-size:17px;max-width:50ch;color:rgba(242,246,249,.86)}
.hero .chip{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.24);color:var(--snow)}
.hero .chip.rb{background:var(--snow);color:var(--night);border-color:var(--snow)}
.next{position:relative;background:rgba(8,14,21,.7);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(242,246,249,.16);color:var(--snow);border-radius:14px;padding:22px;display:grid;gap:14px;overflow:hidden;isolation:isolate}
.next::after{content:"";position:absolute;inset:auto 0 0 0;height:6px;background:repeating-linear-gradient(90deg,var(--kerb) 0 16px,var(--snow) 16px 32px)}
.next .nshape{position:absolute;right:-6%;bottom:6%;width:62%;opacity:.22;z-index:-1;color:var(--snow)}
.next .nshape path{stroke-width:5}
.next .eyebrow{color:rgba(242,246,249,.7)}
.next h3{font-size:26px;font-style:italic;font-weight:800;font-stretch:75%;text-transform:uppercase}
.count{display:flex;align-items:baseline;gap:10px}
.count b{font:italic 900 96px/.8 var(--f-display);font-stretch:62%}
.count span{font:600 13px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:rgba(242,246,249,.72)}
.next dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:14px}
.next dt{font:600 11px/1.6 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:rgba(242,246,249,.6)}
.next dd{margin:0}
.next .chip{background:transparent;color:var(--snow);border-color:rgba(242,246,249,.3)}
.next a{color:var(--snow)}

/* stat strip */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.strip div{padding:16px 18px;display:grid;gap:4px;border-left:1px solid var(--line)}
.strip div:first-child{border-left:0}
@media (max-width:560px){.strip{grid-template-columns:1fr 1fr}.strip div{border-top:1px solid var(--line)}.strip div:nth-child(odd){border-left:0}.strip div:nth-child(-n+2){border-top:0}}
.strip .ic{width:20px;height:20px;color:var(--kerb)}
.strip b{font:italic 850 46px/1 var(--f-display);font-stretch:70%;font-variant-numeric:tabular-nums}
.strip span{font:600 11px/1.3 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}

/* battle */
.battle{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 28px;align-items:center}
@media (max-width:700px){.battle{grid-template-columns:1fr}}
.brows{display:grid;gap:10px}
.brow{display:grid;grid-template-columns:minmax(96px,170px) minmax(0,1fr) 70px;gap:12px;align-items:center;font-size:14px}
.brow .bn{display:flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .bn i{font:italic 800 16px/1 var(--f-display);font-stretch:80%;color:var(--ink-3);width:18px;text-align:right;flex:none}
.brow .bt{height:24px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.brow .bf{display:block;height:100%;background:var(--ink-3);border-radius:5px}
.brow.robin .bf{background:var(--blue)}
.brow.robin .bn{color:var(--blue)}
.brow .bp{font:700 15px/1 var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.gapbox{display:grid;gap:2px;justify-items:start;padding:14px 18px;border-radius:10px;background:var(--surface-2)}
.gapbox b{font:italic 900 56px/.9 var(--f-display);font-stretch:62%;color:var(--kerb)}
.gapbox span{font:600 11px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}

/* timing tower */
.tower{display:grid;margin:0;padding:0;list-style:none}
.tower li{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.tower li:first-child{border-top:0}
.tower .ev{min-width:0}
.tower .ev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tower .ev small{color:var(--ink-2);font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tower time{font:500 12px/1 var(--f-mono);color:var(--ink-3);white-space:nowrap}
.pos{display:inline-grid;place-items:center;min-width:44px;height:30px;padding:0 6px;border-radius:6px;font:italic 800 17px/1 var(--f-display);font-stretch:80%;background:var(--surface-2);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.pos.p1{background:var(--gold);color:#1a1405}
.pos.p2{background:var(--silver);color:#10161c}
.pos.p3{background:var(--bronze);color:#fff}
.pos.p10{background:var(--blue-soft);color:var(--blue)}
.pos.pout{background:var(--kerb-soft);color:var(--kerb)}
.pos.pos-na{background:transparent;color:var(--ink-3)}

/* career grid */
.cgrid{display:grid}
.crow{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.cy{display:grid;gap:2px}
.cy b{font:italic 900 38px/1 var(--f-display);font-stretch:62%}
.cy span{font:600 10.5px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.tiles{display:flex;flex-wrap:wrap;gap:6px}
.tile{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;font:italic 800 16px/1 var(--f-display);font-stretch:80%;border:0;cursor:pointer;background:var(--surface-2);color:var(--ink-2);transition:transform .12s}
.tile:hover{transform:translateY(-2px)}
.tile.t1{background:var(--gold);color:#1a1405}.tile.t2{background:var(--silver);color:#10161c}.tile.t3{background:var(--bronze);color:#fff}
.tile.t10{background:var(--blue-soft);color:var(--blue)}.tile.tout{background:var(--kerb-soft);color:var(--kerb)}
.ctot{display:flex;gap:14px;font:600 12px/1.3 var(--f-mono);color:var(--ink-2);white-space:nowrap}
.ctot span{display:flex;align-items:center;gap:5px}
.ctot .ic{width:15px;height:15px}
.crow .story{grid-column:2/-1}
@media (max-width:640px){.crow{grid-template-columns:1fr;gap:10px}.crow .story{grid-column:1}}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font:500 12px var(--f-mono);color:var(--ink-2)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}

/* trophies */
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.trophy{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.trophy .ti{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.trophy .ti .ic{width:24px;height:24px}
.trophy.title .ti{background:var(--gold);color:#1a1405}
.trophy b.mono{font-size:12px;color:var(--ink-3)}
.trophy p{font-size:14px}

/* race cards */
.races{display:grid;gap:10px}
.yearhead{display:flex;align-items:baseline;gap:12px;margin-top:10px}
.yearhead b{font:italic 900 46px/1 var(--f-display);font-stretch:62%;color:var(--ink)}
.yearhead span{font:600 12px var(--f-mono);color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.race{display:grid;grid-template-columns:64px minmax(0,1fr) 96px;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;scroll-margin-top:140px}
.race > .pos{min-width:58px;height:50px;font-size:25px;border-radius:9px}
.race-main{display:grid;gap:8px;min-width:0}
.race-top{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.race-top b{font:750 18px/1.15 var(--f-display);font-stretch:88%}
.race-top time{font:500 12px var(--f-mono);color:var(--ink-3)}
.race-sub{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:14px;color:var(--ink-2)}
.tstrip{justify-self:start;display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;max-width:100%;background:var(--ground)}
.tstrip span{display:grid;gap:2px;padding:5px 11px;border-left:1px solid var(--line);text-align:center;min-width:52px}
.tstrip span:first-child{border-left:0}
.tstrip small{font:600 9.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.tstrip b{font:600 13px/1.2 var(--f-mono);white-space:nowrap}
.race-shape{color:var(--ink-3);height:64px;display:grid;place-items:center}
.race-shape svg{max-width:100%;max-height:64px;width:auto;height:64px}
.race details.more{grid-column:2/-1}
.race.flash,.track.flash{animation:flash 1.8s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--kerb)}100%{box-shadow:0 0 0 0 transparent}}
@media (max-width:620px){.race{grid-template-columns:56px minmax(0,1fr)}.race-shape{display:none}.race details.more{grid-column:1/-1}}

/* news */
.news{list-style:none;margin:0;padding:0;display:grid}
.news li{display:grid;gap:5px;padding:14px 0;border-top:1px solid var(--line)}
.news li:first-child{border-top:0;padding-top:0}
.news .meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font:500 12px/1.3 var(--f-mono);color:var(--ink-3);letter-spacing:.02em}
.news .meta .cat{color:var(--kerb);text-transform:uppercase;letter-spacing:.08em;font-weight:600;display:inline-flex;gap:5px;align-items:center}
.news .meta .cat .ic{width:14px;height:14px}
.news h4{font:600 16px/1.35 var(--f-body)}
.news h4 a{color:var(--ink);text-decoration:none}
.news h4 a:hover{color:var(--blue);text-decoration:underline}

function normUrl(u) { return String(u || '').replace(/^https?:\/\/(www\.)?/, '').replace(/[?#].*$/, '').replace(/\/$/, '').toLowerCase(); }

    var keep = D.battle || {}; D.battle = AU.battle;

  if (!D.meta) D.meta = {};

    var n = finalOf(newest), tr = trackById(newest.trackId);

function finalsChart(rows) {
  var pts = rows.filter(function (r) { return finalOf(r) != null && parseISO(r.date); }).slice().sort(byDateAsc);
  if (pts.length < 3) return '';
  var W = 760, H = 250, pl = 44, pr = 18, pt = 16, pb = 36;
  var maxP = Math.max(10, Math.ceil(Math.max.apply(null, pts.map(finalOf)) / 5) * 5);
  var n = pts.length;
  function x(i) { return pl + (n === 1 ? 0 : i / (n - 1)) * (W - pl - pr); }
  function y(p) { return pt + (p - 1) / (maxP - 1) * (H - pt - pb); }
  var ticks = [1]; for (var k = 5; k <= maxP; k += 5) ticks.push(k);
  var g = ticks.map(function (k) { return '<line class="grid" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(k) + '" y2="' + y(k) + '"/><text x="' + (pl - 8) + '" y="' + (y(k) + 4) + '" text-anchor="end">P' + k + '</text>'; }).join('');
  var lastY = null, xl = '';
  var lastX = -99;

  if (rules.length) h += '<section class="panel"><h3 class="h3i">' + ic('flag-checkered') + t('rules_h') + '</h3><div>' + rules.map(function (r) { return '<details class="rule"><summary>' + esc(L(r.topic)) + '</summary><p>' + esc(L(r.text)) + '</p></details>'; }).join('') + '</div></section>';
  h += '</div>';
  if (R.how || arr(R.graduates).length) {
    h += '<section class="panel"><div class="sec-head"><h3 style="font-size:30px;font-style:italic;font-weight:850;font-stretch:72%;text-transform:uppercase">' + t('rbjt_h') + '</h3>' + (R.founded ? '<span class="chip">' + esc(R.founded) + '</span>' : '') + '</div>' +
      (L(R.how) ? '<p style="max-width:74ch">' + esc(L(R.how)) + '</p>' : '') + (L(R.kartSignings) ? '<p class="muted" style="max-width:74ch">' + esc(L(R.kartSignings)) + '</p>' : '') +
      (arr(R.graduates).length ? '<h4 class="eyebrow">' + ic('trophy') + t('grads_h') + '</h4><ul class="names">' + R.graduates.map(function (g) { return '<li><b>' + esc(g.name) + '</b><span>' + esc(L(g.note)) + '</span></li>'; }).join('') + '</ul>' : '') +
      (arr(R.dropped).length ? '<details class="more"><summary>' + t('dropped_h') + '</summary><div><ul class="names">' + R.dropped.map(function (g) { return '<li><b>' + esc(g.name) + '</b><span>' + esc(L(g.note)) + '</span></li>'; }).join('') + '</ul></div></details>' : '') +
      (arr(R.roster).length ? '<h4 class="eyebrow">' + ic('users') + t('roster_h') + '</h4><div class="chips">' + R.roster.map(function (n) { return '<span class="chip">' + esc(L(n)) + '</span>'; }).join('') + '</div>' : '') + '</section>';
  }
  var jr = arr(F.juniors);
  if (jr.length) h += '<section class="panel"><h3 class="h3i">' + flag('FIN') + t('finns_jr_h') + '</h3><ul class="names">' + jr.map(function (j) { return '<li><b>' + flag('FIN') + esc(j.name) + '</b><span class="mono" style="font-size:12px">' + esc(j.series || '') + '</span><span>' + esc(L(j.note)) + '</span></li>'; }).join('') + '</ul></section>';
  return h;
}

function vKimi() {
  var K = D.kimi || {}, st = K.stats || {};
  var h = '<div class="plainhead"><p class="eyebrow">' + ic('snowflake') + 'Iceman · Kimster · Robin</p><h2>' + t('kimi_title') + '</h2><p class="muted" style="max-width:62ch">' + t('kimi_intro') + '</p></div>';
  var tiles = [[st.starts,'k_starts','flag-checkered'],[st.wins,'k_wins','trophy'],[st.poles,'k_poles','crown'],[st.podiums,'k_podiums','medal'],[st.fastestLaps,'k_fl','lightning'],[st.titles,'k_title','star']].filter(function (x) { return x[0] != null && x[0] !== ''; });
  if (tiles.length) h += '<div class="kstats">' + tiles.map(function (x) { return '<div>' + ic(x[2]) + '<b>' + esc(x[0]) + '</b><span>' + t(x[1]) + '</span></div>'; }).join('') + '</div>' + (L(st.note) ? '<p class="muted" style="font-size:13px;margin-top:-16px">' + esc(L(st.note)) + '</p>' : '');
  var qs = arr(K.quotes);
  if (qs.length) h += '<section class="panel qpanel"><p class="eyebrow">' + ic('quote') + t('quote_h') + '</p><div id="qbox">' + quoteBlock(qs[S.q % qs.length]) + '</div><button type="button" class="btn" data-act="quote">' + t('quote_btn') + '</button></section>';
  var vs = arr(K.vs);
  if (vs.length) h += '<section class="panel"><h3 class="h3i">' + ic('users') + t('vs_h') + '</h3><div class="tbl-wrap"><table class="vs"><thead><tr><th>' + t('th_topic') + '</th><th class="kimi">Kimi</th><th class="robin">Robin</th></tr></thead><tbody>' + vs.map(function (v) { return '<tr><td>' + esc(L(v.topic)) + '</td><td>' + esc(L(v.kimi)) + '</td><td>' + esc(L(v.robin)) + '</td></tr>'; }).join('') + '</tbody></table></div></section>';
  h += '<div class="grid-2">';
  var path = arr(K.path);
  if (path.length) h += '<section class="panel"><h3 class="h3i">' + ic('steps') + t('path_h') + '</h3><ol class="tl">' + path.map(function (p) { return '<li class="' + (p.key ? 'key' : '') + '"><span class="when">' + esc(p.year) + (p.age ? ' · ' + esc(p.age) + ' ' + yrs() : '') + '</span><b>' + esc(L(p.cat)) + '</b><p>' + esc(L(p.text)) + '</p></li>'; }).join('') + '</ol></section>';
  h += '<div style="display:grid;gap:20px;align-content:start">';
  if (L(K.role)) h += '<section class="panel"><h3 class="h3i">' + ic('wrench') + t('role_h') + '</h3><p>' + esc(L(K.role)) + '</p></section>';
  if (L(K.helmet)) h += '<section class="panel"><h3 class="h3i">' + ic('flag') + t('helmet_h') + '</h3><p>' + esc(L(K.helmet)) + '</p></section>';
  if (arr(K.nicknames).length) h += '<section class="panel"><h3 class="h3i">' + ic('snowflake') + t('nick_h') + '</h3><div class="chips">' + K.nicknames.map(function (n) { return '<span class="chip">' + esc(L(n)) + '</span>'; }).join('') + '</div></section>';
  h += '</div></div>';
  var fins = arr(D.finns && D.finns.f1);
  if (fins.length) h += '<section class="panel"><h3 class="h3i">' + flag('FIN') + t('finns_h') + '</h3><div class="tbl-wrap"><table><tbody>' + fins.map(function (f) { return '<tr><td class="nowrap"><b>' + esc(f.name) + '</b></td><td class="mono nowrap">' + esc(f.years) + '</td><td>' + esc(L(f.highlight)) + '</td></tr>'; }).join('') + '</tbody></table></div></section>';
  return h;
}

function bestScore(v) {
  try { if (v != null) { localStorage.setItem('rr-quiz-best', String(v)); return v; } var b = localStorage.getItem('rr-quiz-best'); return b == null ? null : +b; } catch (e) { return null; }
}
function vQuiz() {
  var Q = arr(D.quiz), z = S.quiz;
  var h = '<div class="plainhead"><p class="eyebrow">' + ic('question') + Q.length + ' ' + t('q_count') + '</p><h2>' + t('quiz_title') + '</h2><p class="muted" style="max-width:62ch">' + t('quiz_intro') + '</p></div>';
  if (!Q.length) return h + '<p class="empty">–</p>';
  h += '<section class="panel quiz">';
  if (z.done) {
    var best = bestScore(); var pct = z.score / Q.length;
    h += '<p class="eyebrow">' + ic('trophy') + t('q_score') + '</p><div class="score">' + z.score + ' / ' + Q.length + '</div><p style="font-size:18px">' + t(pct >= .8 ? 'q_v2' : pct >= .5 ? 'q_v1' : 'q_v0') + '</p>' +
      (best != null ? '<p class="muted">' + t('q_best') + ': <b class="mono">' + best + ' / ' + Q.length + '</b></p>' : '') + '<button type="button" class="btn" data-act="q-again">' + t('q_again') + '</button>';
  } else {
    var q = Q[z.i];
    h += '<div class="qhead"><span class="eyebrow">' + t('q_of') + ' ' + (z.i + 1) + ' / ' + Q.length + '</span><span class="mono" style="font-size:13px">' + z.score + ' ✓</span></div><div class="qbar"><i style="width:' + ((z.i + (z.picked != null ? 1 : 0)) / Q.length * 100) + '%"></i></div>' +
      '<p class="qq">' + esc(L(q.q)) + '</p><div class="opts">' + arr(q.options).map(function (o, i) {
        var cls = z.picked == null ? '' : (i === q.answer ? 'right' : (i === z.picked ? 'wrong' : ''));
        return '<button type="button" data-opt="' + i + '" class="' + cls + '"' + (z.picked != null ? ' disabled' : '') + '><b>' + 'ABCD'[i] + '</b><span>' + esc(L(o)) + '</span></button>';
      }).join('') + '</div>';
    if (z.picked != null) {
      var ok = z.picked === q.answer;
      h += '<div class="explain' + (ok ? '' : ' bad') + '" aria-live="polite"><b>' + t(ok ? 'q_right' : 'q_wrong') + '</b> ' + esc(L(q.explain)) + '</div>' +
        '<button type="button" class="btn" data-act="q-next">' + (z.i + 1 < Q.length ? t('q_next') : t('q_finish')) + '</button>';
    }
  }
  return h + '</section>';
}

var RENDER = {paddock:vPaddock, tulokset:vResults, kalenteri:vCalendar, uutiset:vNews, tekniikka:vTech, radat:vTracks, 'tie-f1':vLadder, kimi:vKimi, visa:vQuiz};

function credits() {
  var items = [];
  arr(A.photos).forEach(function (p) { items.push('<li>' + esc(p.title || p.file) + ' — ' + creditLine(p) + '</li>'); });
  if (A.kart && A.kart.file) items.push('<li>' + esc(A.kart.title || 'Kart') + ' — ' + creditLine(A.kart) + '</li>');
  if (A.tracks && Object.keys(A.tracks).length) items.push('<li>' + t('nav-radat') + ': © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap contributors</a> (ODbL)</li>');
  var im = A.icons && A.icons._meta; if (im) items.push('<li>' + esc(im.set || 'Icons') + ' — ' + (im.source ? '<a href="' + esc(im.source) + '" target="_blank" rel="noopener noreferrer">' + esc(im.license || '') + '</a>' : esc(im.license || '')) + '</li>');
  var fm = A.flags && A.flags._meta; if (fm) items.push('<li>' + esc(fm.set || 'flag-icons') + ' — ' + (fm.source ? '<a href="' + esc(fm.source) + '" target="_blank" rel="noopener noreferrer">' + esc(fm.license || '') + '</a>' : esc(fm.license || '')) + '</li>');
  return items.length ? '<details><summary>' + t('credits_h') + '</summary><p style="margin-top:6px">' + t('credits_note') + '</p><ul>' + items.join('') + '</ul></details>' : '';
}
function renderChrome() {
  document.documentElement.lang = lang;
  $('#tagline').textContent = t('tagline');
  $$('.lang button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang)); });
  $('#nav').innerHTML = VIEWS.map(function (v) { return '<a href="#' + v + '"' + (S.view === v ? ' aria-current="page"' : '') + '>' + ic(NAV_IC[v]) + t('nav-' + v) + '</a>'; }).join('');
  var m = D.meta || {};
  $('#foot').innerHTML = '<p>' + t('foot_1') + '</p><p>' + t('foot_2') + '</p>' + (m.updated ? '<p class="mono">' + t('updated') + ': ' + fmtDate(m.updated) + (AU && AU.checked ? ' · ' + t('checked') + ': ' + fmtDate(String(AU.checked).slice(0, 10)) : '') + '</p>' : '') + credits();
}
function render() {
  renderChrome();
  var main = $('#main');
  if (!window.RR_DATA) { main.innerHTML = '<p class="empty">' + t('no_data') + '</p>'; return; }
  main.innerHTML = '<div class="view" id="v-' + S.view + '">' + RENDER[S.view]() + '</div>';
  var cur = $('#nav a[aria-current]'); if (cur && cur.scrollIntoView) { try { cur.scrollIntoView({block:'nearest', inline:'nearest'}); } catch (e) {} }
}
function go(v) {
  if (VIEWS.indexOf(v) < 0) v = 'paddock';
  var changed = v !== S.view; S.view = v; render();
  if (changed) window.scrollTo(0, 0);
}
function fromHash() { var h = (location.hash || '').replace('#', ''); return VIEWS.indexOf(h) > -1 ? h : 'paddock'; }
function flashTo(el) { if (!el) return; el.scrollIntoView({behavior:'smooth', block:'start'}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); var d = el.querySelector('details.more'); if (d) d.open = true; }
function switchTo(v) { if (S.view !== v) { S.view = v; try { history.pushState(null, '', '#' + v); } catch (e) {} } render(); }

document.addEventListener('click', function (ev) {
  var el = ev.target.closest('button');
  if (!el) return;
  if (el.hasAttribute('data-lang')) { lang = el.getAttribute('data-lang'); try { localStorage.setItem('rr-lang', lang); } catch (e) {} render(); return; }
  if (el.hasAttribute('data-track')) { switchTo('radat'); flashTo(document.getElementById('trk-' + el.getAttribute('data-track'))); return; }
  if (el.hasAttribute('data-res')) { var id = el.getAttribute('data-res'); if (S.resYear !== 'all') S.resYear = 'all'; switchTo('tulokset'); flashTo(document.getElementById('res-' + id)); return; }
  if (el.hasAttribute('data-year')) { S.resYear = el.getAttribute('data-year'); render(); return; }
  if (el.hasAttribute('data-cat')) { S.newsCat = el.getAttribute('data-cat'); render(); return; }
  if (el.hasAttribute('data-part')) { S.part = el.getAttribute('data-part'); render(); if (window.innerWidth < 860) { var pc = $('.part-card'); if (pc) pc.scrollIntoView({behavior:'smooth', block:'nearest'}); } return; }
  if (el.hasAttribute('data-metric')) { S.metric = el.getAttribute('data-metric'); render(); return; }
  if (el.hasAttribute('data-ref')) { S.showRef = !S.showRef; render(); return; }
  if (el.hasAttribute('data-opt')) { if (S.quiz.picked == null) { S.quiz.picked = +el.getAttribute('data-opt'); if (S.quiz.picked === arr(D.quiz)[S.quiz.i].answer) S.quiz.score++; render(); } return; }
  var act = el.getAttribute('data-act');
  if (act === 'fact') { S.fact++; render(); return; }
  if (act === 'quote') { var n = arr(D.kimi && D.kimi.quotes).length; if (n > 1) { var r; do { r = Math.floor(Math.random() * n); } while (r === S.q % n); S.q = r; } var box = $('#qbox'); if (box) box.innerHTML = quoteBlock(D.kimi.quotes[S.q % n]); return; }
  if (act === 'q-next') { if (S.quiz.i + 1 < arr(D.quiz).length) { S.quiz.i++; S.quiz.picked = null; } else { S.quiz.done = true; var b = bestScore(); if (b == null || S.quiz.score > b) bestScore(S.quiz.score); } render(); return; }
  if (act === 'q-again') { S.quiz = {i:0, score:0, picked:null, done:false}; render(); return; }
});
document.addEventListener('input', function (ev) {
  if (ev.target.id === 'gloss-q') { S.gloss = ev.target.value; var gl = $('#gloss-list'); if (gl) gl.innerHTML = glossItems(arr(D.tech && D.tech.glossary)); }
});
window.addEventListener('hashchange', function () { go(fromHash()); });
try { mergeAuto(); } catch (e) {}
S.view = fromHash();
render();
})();
</script>
